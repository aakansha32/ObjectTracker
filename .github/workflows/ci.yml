name: ObjectTracker CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-check:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q .

      - name: Check Flask application and health endpoint
        env:
          SECRET_KEY: ci-test-secret-key
          JWT_SECRET_KEY: ci-test-jwt-secret
          MONGO_URI: mongodb://localhost:27017/object_tracker
        run: |
          python -c "from app import app; client = app.test_client(); response = client.get('/api/health'); assert response.status_code == 200, response.get_data(as_text=True); assert response.get_json()['status'] == 'healthy'; print('Flask health check passed')"
